<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSA x HIMAPTIKA | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* Menggunakan font ala Google */
        h1, h2, h3, h4, h5, h6, .google-font { font-family: 'Google Sans', sans-serif; }
        body, p, span, td, th { font-family: 'Roboto', sans-serif; background-color: #f8f9fa; }
        
        /* Custom scrollbar ala Material */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #bdc1c6; }
        
        /* Sidebar Menu Styles */
        .menu-btn {
            border-radius: 0 24px 24px 0;
            margin-right: 16px;
            transition: all 0.2s ease;
        }
        .menu-active { 
            background-color: #e8f0fe; 
            color: #1a73e8; 
            font-weight: 500; 
        }
        .menu-inactive { 
            color: #3c4043; 
        }
        .menu-inactive:hover { 
            background-color: #f1f3f4; 
        }

        /* Material Card Shadow */
        .card-shadow {
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        /* Tabel Hover Effect yang Halus */
        tbody tr {
            transition: background-color 0.15s ease;
        }
        tbody tr:hover {
            background-color: #f8f9fa;
        }

        /* Loading Spinner Animation */
        .g-spinner {
            animation: rotate 2s linear infinite;
            z-index: 2;
            width: 50px;
            height: 50px;
        }
        .g-spinner .path {
            stroke: #4285F4;
            stroke-linecap: round;
            animation: dash 1.5s ease-in-out infinite;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes dash {
            0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }
            100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col z-20 hidden md:flex shrink-0">
        <!-- Logo Area -->
        <div class="h-16 flex items-center px-6 border-b border-gray-200 shrink-0">
            <div class="flex items-center gap-2">
                <div class="flex gap-1">
                    <div class="w-2.5 h-2.5 rounded-full bg-[#4285F4]"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-[#EA4335]"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-[#FBBC05]"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-[#34A853]"></div>
                </div>
                <h1 class="text-xl font-bold google-font tracking-tight text-gray-700 ml-1">Workspace</h1>
            </div>
        </div>
        
        <!-- Navigation -->
        <div class="flex-1 overflow-y-auto py-4">
            <p class="px-6 text-[11px] font-medium text-gray-500 uppercase tracking-widest mb-3">Menu Utama</p>
            <nav class="space-y-1" id="nav-menu">
                <!-- Menu akan di-generate via JS -->
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen relative min-w-0">
        <!-- Topbar -->
        <header class="bg-white h-16 flex items-center justify-between px-6 z-10 border-b border-gray-200 shrink-0">
            <div class="flex items-center">
                <h2 id="page-title" class="text-xl font-medium google-font text-gray-800">Beranda</h2>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="fetchData()" class="flex items-center px-4 py-2 text-sm font-medium text-[#1a73e8] hover:bg-blue-50 rounded-md transition-colors" title="Sinkronisasi Data">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Segarkan
                </button>
                <div class="w-8 h-8 rounded-full bg-[#1a73e8] text-white flex items-center justify-center font-medium text-sm shadow-sm cursor-pointer">
                    A
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-auto p-4 sm:p-8 relative">
            
            <!-- Loading Overlay -->
            <div id="loading" class="absolute inset-0 bg-white bg-opacity-90 flex flex-col items-center justify-center z-50 transition-opacity duration-300">
                <svg class="g-spinner" viewBox="0 0 50 50">
                    <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
                </svg>
                <p class="text-gray-600 mt-4 google-font font-medium tracking-wide">Menyinkronkan data...</p>
            </div>

            <!-- VIEW: BERANDA (STATISTIK) -->
            <div id="view-beranda" class="hidden animate-fade-in max-w-7xl mx-auto">
                <div class="mb-8">
                    <h3 class="text-2xl google-font font-medium text-gray-800">Ringkasan Pendaftaran</h3>
                    <p class="text-gray-500 mt-1">Pantau perkembangan peserta workshop GSA x HIMAPTIKA.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white rounded-2xl p-6 card-shadow relative overflow-hidden group border border-gray-100">
                        <div class="absolute top-0 right-0 p-4 opacity-5 transform translate-x-2 -translate-y-2 group-hover:scale-110 transition-transform duration-500">
                            <svg class="w-20 h-20 text-[#4285F4]" fill="currentColor" viewBox="0 0 20 20"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"></path></svg>
                        </div>
                        <p class="text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wider">Total Partisipan</p>
                        <h3 class="text-5xl google-font font-medium text-[#1a73e8]" id="stat-total">0</h3>
                    </div>
                </div>

                <h3 class="text-lg google-font font-medium text-gray-800 mb-4 border-b border-gray-200 pb-2">Sebaran per Pemateri</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5" id="stat-workshops">
                    <!-- Cards per speaker -->
                </div>
            </div>

            <!-- VIEW: DATA TABLE (PER SPEAKER) -->
            <div id="view-table" class="hidden animate-fade-in max-w-7xl mx-auto h-full flex flex-col">
                
                <!-- Table Controls Area -->
                <div class="bg-white rounded-t-2xl p-6 border-b border-gray-200 card-shadow z-10 relative">
                    <div class="flex flex-col lg:flex-row justify-between gap-6 items-end">
                        
                        <!-- Event Selector Dropdown -->
                        <div class="w-full lg:w-3/5">
                            <label for="event-selector" class="block text-[11px] font-semibold text-gray-500 uppercase tracking-widest mb-2">Filter Berdasarkan Event</label>
                            <div class="relative">
                                <select id="event-selector" onchange="applyFilters()" class="block w-full pl-4 pr-10 py-3 text-sm text-gray-700 bg-[#f8f9fa] border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#1a73e8] focus:border-transparent rounded-lg appearance-none cursor-pointer hover:bg-gray-100 transition-colors">
                                    <!-- Opsi event akan di-generate via JS -->
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                        </div>

                        <!-- Search Input -->
                        <div class="w-full lg:w-2/5">
                            <div class="relative w-full">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                </div>
                                <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Cari nama atau instansi..." class="block w-full pl-11 pr-4 py-3 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#1a73e8] focus:border-transparent transition-shadow placeholder-gray-400 shadow-sm">
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Table Wrapper -->
                <div class="bg-white rounded-b-2xl card-shadow flex-1 overflow-hidden flex flex-col -mt-px relative z-0">
                    <div class="flex-1 overflow-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-white sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th scope="col" class="px-8 py-4 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-widest w-16">No</th>
                                    <th scope="col" class="px-4 py-4 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-widest">Info Peserta</th>
                                    <th scope="col" class="px-4 py-4 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-widest">Kontak</th>
                                    <th scope="col" class="px-4 py-4 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-widest">Asal Instansi</th>
                                    <th scope="col" class="px-8 py-4 text-left text-[11px] font-semibold text-gray-500 uppercase tracking-widest">Waktu Daftar</th>
                                </tr>
                            </thead>
                            <tbody id="table-body" class="bg-white divide-y divide-gray-100">
                                <!-- Baris tabel akan di-generate via JS -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Table Footer -->
                    <div class="bg-gray-50 px-8 py-4 border-t border-gray-200 flex items-center justify-between rounded-b-2xl">
                        <p class="text-sm text-gray-600" id="table-count">Menampilkan <span class="font-semibold text-gray-900">0</span> hasil</p>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <script>
        // ==========================================
        // 1. KONFIGURASI DATABASE & MENU
        // ==========================================
        
        // URL SCRIPT SUDAH DIUPDATE
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3BSJKCJD8ZWJgwZfVaHyI4FkpntDUToe-kHlYPcBo5ZJPeFZfuhJsn-c8HXHyqImywA/exec"; 

        let masterData = [];

        // DATABASE SPEAKER & EVENT BARU (Kak Nesha Dikosongkan)
        const speakersData = [
            { 
                id: 'fauzan', 
                label: 'Kak Fauzan', 
                events: ['Hack Tugas Kuliah: Maksimalkan Efektifitas Pemahaman Materi Kuliah Melalui Tugas dengan Gemini'] 
            },
            { 
                id: 'acha', 
                label: 'Kak Acha', 
                events: ['AI Oracle Night: Cara Cepat Nemu Cita-Cita, Ide Cuan, & Future Planning Bareng Google AI'] 
            },
            { 
                id: 'farida', 
                label: 'Kak Farida', 
                events: ['Workshop AI Campus: Smart Research & Study Hack with NotebookLM'] 
            },
            { 
                id: 'zulfa', 
                label: 'Kak Zulfa', 
                events: ['Smart Study & Smart Career: Membangun Portofolio dan Skill Masa Depan Bersama Gemini'] 
            },
            { 
                id: 'alodia', 
                label: 'Kak Alodia', 
                events: ['Google MathEdu Interaktif: Eksplorasi Matematika Cepat & Efektif dengan Gemini Flash dan Google Workspace'] 
            },
            { 
                id: 'pinki', 
                label: 'Kak Pinki', 
                events: [
                    'Prompting 101: Maksimalkan Gemini Flash untuk Mahasiswa ', 
                    'Create with AI: Eksplorasi Kreativitas dengan Nano Banana'
                ] 
            },
            { 
                id: 'nesha', 
                label: 'Kak Nesha', 
                events: [] // Dibiarkan kosong sesuai permintaan
            }
        ];

        // Definisi Menu Lengkap
        const menuConfig = [
            { id: 'beranda', label: 'Beranda', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6', type: 'system' }
        ];
        
        // Inject speaker ke menuConfig
        speakersData.forEach(sp => {
            menuConfig.push({ id: sp.id, label: sp.label, icon: 'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z', type: 'speaker', events: sp.events });
        });

        let currentMenuId = 'beranda';

        // ==========================================
        // 2. CORE LOGIC
        // ==========================================

        function initApp() {
            renderSidebar();
            fetchData();
        }

        async function fetchData() {
            const loadingEl = document.getElementById('loading');
            loadingEl.classList.remove('hidden');
            loadingEl.style.opacity = '1';
            
            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();
                
                if(result.status === "success") {
                    masterData = result.data;
                    changeMenu(currentMenuId); 
                } else {
                    alert("Gagal mengambil data: " + result.pesan);
                }
            } catch (error) {
                console.error("Error Fetch:", error);
                alert("Gagal terhubung ke database server.");
            } finally {
                loadingEl.style.opacity = '0';
                setTimeout(() => loadingEl.classList.add('hidden'), 300);
            }
        }

        // ==========================================
        // 3. UI RENDERING
        // ==========================================

        function renderSidebar() {
            const nav = document.getElementById('nav-menu');
            nav.innerHTML = '';
            
            menuConfig.forEach(menu => {
                const isActive = menu.id === currentMenuId;
                const cssClass = isActive ? 'menu-active' : 'menu-inactive';
                const iconColor = isActive ? 'text-[#1a73e8]' : 'text-gray-400';
                
                nav.innerHTML += `
                    <button onclick="changeMenu('${menu.id}')" class="menu-btn w-full flex items-center px-6 py-3 text-[14px] ${cssClass}">
                        <svg class="w-[22px] h-[22px] mr-4 ${iconColor}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${menu.icon}"></path>
                        </svg>
                        ${menu.label}
                    </button>
                `;
            });
        }

        function changeMenu(menuId) {
            currentMenuId = menuId;
            renderSidebar();
            
            const selectedMenu = menuConfig.find(m => m.id === menuId);
            document.getElementById('page-title').innerText = selectedMenu.label;
            document.getElementById('searchInput').value = '';

            if (selectedMenu.type === 'system') {
                document.getElementById('view-beranda').classList.remove('hidden');
                document.getElementById('view-table').classList.add('hidden');
                renderBeranda();
            } else if (selectedMenu.type === 'speaker') {
                document.getElementById('view-beranda').classList.add('hidden');
                document.getElementById('view-table').classList.remove('hidden');
                setupSpeakerView(selectedMenu);
            }
        }

        // --- BERANDA VIEW ---
        function renderBeranda() {
            document.getElementById('stat-total').innerText = masterData.length;

            const statContainer = document.getElementById('stat-workshops');
            statContainer.innerHTML = '';

            // Hitung total peserta per Speaker (gabungan semua eventnya)
            speakersData.forEach(speaker => {
                let totalPesertaSpeaker = 0;
                
                speaker.events.forEach(eventName => {
                    const count = masterData.filter(row => 
                        row["Workshop Pilihan"] && row["Workshop Pilihan"].includes(eventName)
                    ).length;
                    totalPesertaSpeaker += count;
                });

                // Tampilan Card ala Google Material
                statContainer.innerHTML += `
                    <div class="bg-white rounded-xl card-shadow p-5 border border-gray-100 flex items-center gap-4 hover:shadow-md transition-shadow cursor-pointer" onclick="changeMenu('${speaker.id}')">
                        <div class="w-12 h-12 rounded-full bg-blue-50 text-[#1a73e8] flex items-center justify-center shrink-0">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-medium text-gray-800 truncate">${speaker.label}</p>
                            <p class="text-xs text-gray-500 truncate">${speaker.events.length} Event Dikelola</p>
                        </div>
                        <div class="text-xl google-font font-medium text-[#4285F4]">
                            ${totalPesertaSpeaker}
                        </div>
                    </div>
                `;
            });
        }

        // --- SPEAKER TABLE VIEW ---
        function setupSpeakerView(speakerConfig) {
            const selector = document.getElementById('event-selector');
            selector.innerHTML = '';

            if (speakerConfig.events.length === 0) {
                // Kasus jika belum ada event (Kak Nesha)
                selector.innerHTML = `<option value="NONE">Belum ada event tersedia</option>`;
                selector.disabled = true;
            } else {
                selector.disabled = false;
                // Opsi "Semua Event" dari Speaker Ini
                selector.innerHTML += `<option value="ALL">Lihat Semua Event ${speakerConfig.label}</option>`;
                
                // Tambahkan list event spesifik ke dalam dropdown
                speakerConfig.events.forEach((eventName, index) => {
                    let shortName = eventName.length > 50 ? eventName.substring(0, 50) + '...' : eventName;
                    selector.innerHTML += `<option value="${index}">${shortName}</option>`;
                });
            }

            // Jalankan filter awal
            applyFilters();
        }

        // --- Helper Function: Merapikan Teks jadi Title Case (Kapital Awal Saja) ---
        function toTitleCase(str) {
            if (!str) return '-';
            return str.toLowerCase().replace(/(?:^|\s|-)\w/g, function(match) {
                return match.toUpperCase();
            });
        }

        // Fungsi menggabungkan Filter Dropdown & Pencarian Teks
        function applyFilters() {
            const selectedMenu = menuConfig.find(m => m.id === currentMenuId);
            const selector = document.getElementById('event-selector');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('table-body');
            
            tbody.innerHTML = '';

            // Jika tidak ada event sama sekali (Kak Nesha)
            if (selector.value === "NONE" || selectedMenu.events.length === 0) {
                document.getElementById('table-count').innerHTML = `Menampilkan <span class="font-medium text-[#1a73e8]">0</span> hasil`;
                tbody.innerHTML = `
                    <tr><td colspan="5" class="px-6 py-16 text-center">
                        <div class="flex flex-col items-center justify-center text-gray-400">
                            <svg class="w-12 h-12 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <p class="text-sm font-medium text-gray-500">Pemateri belum memiliki jadwal event aktif.</p>
                        </div>
                    </td></tr>`;
                return;
            }

            // 1. Tentukan event mana saja yang akan difilter berdasarkan dropdown
            let eventsToFilter = [];
            if (selector.value === "ALL") {
                eventsToFilter = selectedMenu.events; // Semua event milik speaker ini
            } else {
                eventsToFilter = [selectedMenu.events[parseInt(selector.value)]]; // Event spesifik
            }

            // 2. Filter Master Data
            let filteredData = [];
            
            masterData.forEach(row => {
                // Cek apakah kolom "Workshop Pilihan" orang ini mengandung SATU SAJA dari eventsToFilter
                let isInEvent = false;
                eventsToFilter.forEach(evName => {
                    if (row["Workshop Pilihan"] && row["Workshop Pilihan"].includes(evName)) {
                        isInEvent = true;
                    }
                });

                if (isInEvent) {
                    // Jika lolos filter event, cek text search query
                    const name = (row["Nama"] || '').toLowerCase();
                    const univ = (row["Universitas"] || '').toLowerCase();
                    
                    if (name.includes(searchQuery) || univ.includes(searchQuery)) {
                        // Tambahkan properti event name yang cocok untuk ditampikan di badge
                        let matchedEvent = eventsToFilter.find(ev => row["Workshop Pilihan"].includes(ev)) || "Event";
                        // Potong string untuk badge kalau kepanjangan
                        let badgeName = matchedEvent.split(':')[0]; // Ambil kata sebelum titik dua jika ada
                        
                        row._badgeName = badgeName.length > 25 ? badgeName.substring(0,25)+'...' : badgeName;
                        filteredData.push(row);
                    }
                }
            });

            // 3. Render Baris Tabel
            document.getElementById('table-count').innerHTML = `Menampilkan <span class="font-medium text-[#1a73e8]">${filteredData.length}</span> hasil`;

            if (filteredData.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="5" class="px-6 py-16 text-center">
                        <div class="flex flex-col items-center justify-center text-gray-400">
                            <svg class="w-12 h-12 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <p class="text-sm font-medium text-gray-500">Tidak ada data yang cocok dengan pencarian.</p>
                        </div>
                    </td></tr>`;
                return;
            }

            filteredData.forEach((row, index) => {
                // Formatting data menggunakan helper toTitleCase agar tidak ALAY/HURUF BESAR SEMUA
                const nama = toTitleCase(row["Nama"]);
                const email = (row["Email"] || '-').toLowerCase(); // Email biasanya kecil
                const wa = row["Whatsapp"] || '-';
                const univ = toTitleCase(row["Universitas"]);
                const fakultas = toTitleCase(row["Fakultas"]);
                const jurusan = toTitleCase(row["Jurusan"]);
                const waktu = row["Waktu Daftar"] || '-';

                // Format Tanggal sederhana
                let dateDisplay = waktu;
                if(waktu !== '-') {
                    try { 
                        let d = new Date(waktu); 
                        if(!isNaN(d)) dateDisplay = d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) + ' <span class="text-gray-400 ml-1">' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}) + '</span>'; 
                    } catch(e){}
                }

                tbody.innerHTML += `
                    <tr>
                        <td class="px-8 py-5 whitespace-nowrap text-sm text-gray-500">${index + 1}</td>
                        <td class="px-4 py-5">
                            <div class="flex items-center">
                                <div class="h-9 w-9 rounded-full bg-[#e8f0fe] text-[#1967d2] flex items-center justify-center font-semibold text-sm mr-4 shrink-0 uppercase">
                                    ${nama.charAt(0)}
                                </div>
                                <div>
                                    <div class="text-[14px] font-semibold text-gray-900 mb-1">${nama}</div>
                                    <div class="inline-flex items-center bg-[#f1f3f4] text-gray-600 px-2 py-0.5 rounded text-[11px] font-medium tracking-wide">
                                        ${row._badgeName}
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td class="px-4 py-5 whitespace-nowrap">
                            <div class="flex flex-col gap-1.5">
                                <div class="text-[13px] text-gray-600 flex items-center gap-2">
                                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg> 
                                    ${email}
                                </div>
                                <div class="text-[13px] text-gray-600 flex items-center gap-2">
                                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg> 
                                    ${wa}
                                </div>
                            </div>
                        </td>
                        <td class="px-4 py-5">
                            <div class="text-[14px] font-medium text-gray-900 mb-1">${univ}</div>
                            <div class="text-[12px] text-gray-500">${fakultas} - ${jurusan} <span class="text-gray-400 ml-1">(Smtr. ${row["Semester"] || '-'})</span></div>
                        </td>
                        <td class="px-8 py-5 whitespace-nowrap text-[13px] text-gray-600">
                            ${dateDisplay}
                        </td>
                    </tr>
                `;
            });
        }

        // Init config for Tailwind
        tailwind.config = {
            theme: {
                extend: {
                    animation: { 'fade-in': 'fadeIn 0.3s ease-out forwards' },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(5px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }

        // Mulai aplikasi
        initApp();
    </script>
</body>
</html>
